name: Build APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Pasang Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Tambah fail yang hilang
        run: |
          curl -sL https://github.com/gradle/gradle/raw/v8.7.0/subprojects/wrapper/src/main/resources/org/gradle/api/internal/tasks/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
          ls -la gradle/wrapper/

      - name: Bina APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: ReptiManager-APK
          path: app/build/outputs/apk/debug/app-debug.apk
